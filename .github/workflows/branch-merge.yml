name: Branch Merge Workflow
on:
  pull_request:
    branches:
      - "main"
    types: [closed]

jobs:
  check-should-run:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check should run
        id: check
        run: |
          if [[ "${{ github.event.pull_request.merged }}" && \
                "${{ startsWith(github.head_ref, 'feature/') }}" && \
                "${{ github.base_ref }}" == "main" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  execute-on-merge:
    needs: check-should-run
    if: needs.check-should-run.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
      
      - name: Show current branch
        run: |
          echo "::notice::=== Branch Information ==="
          echo "::notice::Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "::notice::Current commit: $(git rev-parse HEAD)"
          echo "::notice::Target branch (base_ref): ${{ github.base_ref }}"
          echo "::notice::Source branch (head_ref): ${{ github.head_ref }}"
          echo "::notice::PR was merged into: ${{ github.base_ref }}"